<?xml version="1.0" encoding="UTF-8"?>
<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="0.55" stop-color="#1b2a6b"/>
      <stop offset="1" stop-color="#2563eb"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.42" r="0.6">
      <stop offset="0" stop-color="#22c55e" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#22c55e" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="hi" cx="0.3" cy="0.22" r="0.8">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="9" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- fondo -->
  <rect x="0" y="0" width="512" height="512" rx="115" fill="url(#bg)"/>
  <rect x="0" y="0" width="512" height="512" rx="115" fill="url(#hi)"/>
  <rect x="0" y="0" width="512" height="512" rx="115" fill="url(#glow)"/>

  <!-- aro planetario sutil -->
  <g transform="rotate(-20 256 256)" opacity="0.5">
    <ellipse cx="256" cy="256" rx="232" ry="66" fill="none" stroke="#9fb0d0" stroke-opacity="0.22" stroke-width="9"/>
    <ellipse cx="256" cy="256" rx="206" ry="52" fill="none" stroke="#9fb0d0" stroke-opacity="0.12" stroke-width="5"/>
  </g>

  <!-- simbolo de encendido con glow -->
  <g filter="url(#soft)" fill="none" stroke-linecap="round">
    <!-- aro (gap arriba) -->
    <path d="M310.5,192.2 A95,95 0 1 1 201.5,192.2"
          stroke="#22c55e" stroke-opacity="0.9" stroke-width="40"/>
    <path d="M310.5,192.2 A95,95 0 1 1 201.5,192.2"
          stroke="#ffffff" stroke-width="28"/>
    <!-- barra vertical -->
    <rect x="240" y="150" width="32" height="128" rx="16" fill="#ffffff" stroke="none"/>
    <rect x="245" y="155" width="22" height="118" rx="11" fill="#22c55e" fill-opacity="0.0" stroke="none"/>
  </g>
</svg>
