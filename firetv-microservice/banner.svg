<?xml version="1.0" encoding="UTF-8"?>
<svg width="320" height="180" viewBox="0 0 320 180" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="320" y2="180" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="0.6" stop-color="#17224f"/>
      <stop offset="1" stop-color="#2563eb"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.28" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#22c55e" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#22c55e" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect x="0" y="0" width="320" height="180" fill="url(#bg)"/>
  <rect x="0" y="0" width="320" height="180" fill="url(#glow)"/>

  <!-- aro planetario sutil -->
  <g transform="rotate(-20 90 90)" opacity="0.5">
    <ellipse cx="90" cy="90" rx="78" ry="22" fill="none" stroke="#9fb0d0" stroke-opacity="0.22" stroke-width="4"/>
  </g>

  <!-- simbolo de encendido -->
  <g filter="url(#soft)" fill="none" stroke-linecap="round">
    <path d="M119.8,55.4 A52,52 0 1 1 60.2,55.4" stroke="#22c55e" stroke-opacity="0.9" stroke-width="22"/>
    <path d="M119.8,55.4 A52,52 0 1 1 60.2,55.4" stroke="#ffffff" stroke-width="15"/>
    <rect x="82" y="38" width="16" height="62" rx="8" fill="#ffffff" stroke="none"/>
  </g>

  <!-- texto -->
  <text x="172" y="86" font-family="Roboto, Arial, sans-serif" font-size="44" font-weight="700" fill="#ffffff">Urano</text>
  <text x="174" y="116" font-family="Roboto, Arial, sans-serif" font-size="18" fill="#9fb0d0">control de energ&#237;a</text>
</svg>
