<style>
  :root{
    --bg:#0b1020; --card:#141b31; --line:#243154; --fg:#e8eefc; --muted:#9fb0d0;
    --up:#22c55e; --down:#64748b; --busy:#f59e0b; --danger:#ef4444; --accent:#3b82f6;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{
    background:var(--bg); color:var(--fg);
    font-family:system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;
    display:flex; align-items:center; justify-content:center; padding:16px;
  }
  .card{
    width:100%; max-width:460px; background:var(--card); border:1px solid var(--line);
    border-radius:18px; padding:28px 24px; box-shadow:0 20px 60px rgba(0,0,0,.4);
  }
  .brand{display:flex; align-items:center; gap:12px; margin-bottom:4px}
  .logo{width:42px; height:42px; border-radius:10px; flex:0 0 auto}
  h1{margin:0; font-size:22px; letter-spacing:.3px}
  .host{color:var(--muted); font-size:13px; margin-bottom:22px}
  .state{
    display:flex; align-items:center; gap:14px; padding:18px; border-radius:14px;
    background:#0e1526; border:1px solid var(--line); margin-bottom:22px;
  }
  .dot{width:18px; height:18px; border-radius:50%; background:var(--down); flex:0 0 auto}
  .dot.up{background:var(--up); box-shadow:0 0 0 6px rgba(34,197,94,.15)}
  .dot.down{background:var(--down)}
  .dot.busy{background:var(--busy); animation:pulse 1s infinite}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
  .state .txt b{font-size:20px; display:block}
  .state .txt small{color:var(--muted)}
  .elec{display:flex; align-items:center; gap:10px; margin:-8px 0 20px;
    padding:11px 14px; border-radius:12px; background:#0e1526; border:1px solid var(--line)}
  .dotE{width:12px; height:12px; border-radius:50%; background:var(--down); flex:0 0 auto}
  .dotE.on{background:var(--up); box-shadow:0 0 0 5px rgba(34,197,94,.12)}
  .dotE.off{background:var(--danger); box-shadow:0 0 0 5px rgba(239,68,68,.14)}
  .elec small{color:var(--muted)}
  .btns{display:grid; grid-template-columns:1fr 1fr; gap:12px}
  button{
    appearance:none; border:none; border-radius:12px; padding:16px; font-size:16px;
    font-weight:600; cursor:pointer; color:#fff; transition:transform .05s, opacity .2s;
  }
  button:active{transform:scale(.98)}
  button:disabled{opacity:.4; cursor:not-allowed}
  button:focus-visible{outline:3px solid #fff}
  .on{background:var(--up)}
  .off{background:var(--danger)}
  .auto{margin-top:18px; padding:14px; border-radius:12px; background:#0e1526; border:1px solid var(--line)}
  .autoTitle{font-weight:600}
  .autoOpts{display:flex; flex-wrap:wrap; gap:10px 24px; margin-top:10px}
  .autoRow{display:flex; align-items:center; gap:10px; font-weight:600; cursor:pointer}
  .autoRow input{width:20px; height:20px; margin:0; accent-color:var(--up); cursor:pointer; flex:0 0 auto}
  .autoRow input:disabled{cursor:wait}
  .autoRow input:focus-visible{outline:3px solid #fff; outline-offset:2px}
  .autoTxt{margin:8px 0 0; font-size:13px; line-height:1.45; color:var(--muted)}
  .msg{min-height:20px; margin-top:16px; font-size:14px; text-align:center; color:var(--muted)}
  .msg.err{color:var(--danger)}
  .msg.ok{color:var(--up)}
  details{margin-top:18px}
  summary{color:var(--muted); font-size:13px; cursor:pointer}
  .tokrow{display:flex; gap:8px; margin-top:10px}
  input{
    flex:1; background:#0e1526; border:1px solid var(--line); color:var(--fg);
    border-radius:10px; padding:10px 12px; font-size:14px;
  }
  .save{background:var(--accent); padding:10px 14px; font-size:14px}
  .hist{display:block; margin-top:16px; padding:11px 14px; border-radius:12px; text-align:center;
    background:#0e1526; border:1px solid var(--line); color:var(--fg); text-decoration:none; font-size:14px}
  .hist:hover,.hist:focus-visible{border-color:var(--accent); outline:none}
</style>
</head>

  try { token = localStorage.getItem("urano_token") || ""; } catch(e){}
  tokenInput.value = token;

  document.getElementById("saveTok").addEventListener("click", function(){
    token = tokenInput.value.trim();
    try { localStorage.setItem("urano_token", token); } catch(e){}
    flash("Token guardado", "ok");
  });

  var prevState = null;
  var pending = null; // {accion, t0}: accion pedida desde esta pagina, pendiente de resultado
  var pollTimer = null;

  function headers(extra){
    var h = extra || {};
    if (token) h["X-Token"] = token;
    return h;
  }

  function flash(text, cls){
    msg.textContent = text;
    msg.className = "msg" + (cls ? " " + cls : "");
  }

  function render(state, elec){
    stateLabel.textContent = state;
    var busy = !STABLE[state];
    dot.className = "dot " + (state==="ARRIBA"?"up":state==="ABAJO"?"down":"busy");
    if (state === "ARRIBA")      stateHint.textContent = "Urano encendido";
    else if (state === "ABAJO")  stateHint.textContent = "Urano apagado";
    else if (state === "ENCENDIENDO") stateHint.textContent = "encendiendo… espera";
    else if (state === "APAGANDO")    stateHint.textContent = "apagando… espera";

    // indicador de servicio electrico
    dotE.className = "dotE " + (elec===true?"on":elec===false?"off":"");
    elecLabel.textContent = elec===true  ? "Servicio eléctrico: Sí"
                          : elec===false ? "Sin servicio eléctrico — no se puede encender"
                          : "Servicio eléctrico: —";

    // bloqueo de botones: transicion, estado ya satisfecho, y sin corriente no se enciende
    btnOn.disabled  = busy || state === "ARRIBA" || elec === false;
    btnOff.disabled = busy || state === "ABAJO";

    // resultado de la accion pedida desde esta pagina (aunque la transicion
    // haya sido tan corta que el polling no llegara a ver el estado transitorio)
    if (pending) {
      var target = pending.accion === "apagar" ? "ABAJO" : "ARRIBA";
      var origin = pending.accion === "apagar" ? "ARRIBA" : "ABAJO";
      if (state === target) {
        flash(pending.accion === "apagar" ? "Apagado completado" : "Encendido completado", "ok");
        pending = null;
      } else if (state === origin && Date.now() - pending.t0 > 2500) {
        flash(pending.accion === "apagar" ? "No se pudo apagar Urano" : "No se pudo encender Urano", "err");
        pending = null;
      }
    } else if (prevState && !STABLE[prevState] && STABLE[state]) {
      // operacion iniciada desde otro cliente: informar segun el estado final real
      var okFin = (prevState === "APAGANDO" && state === "ABAJO") || (prevState === "ENCENDIENDO" && state === "ARRIBA");
      flash(okFin ? (state === "ABAJO" ? "Apagado completado" : "Encendido completado")
                  : (prevState === "APAGANDO" ? "El apagado no se completó" : "El encendido no se completó"),
            okFin ? "ok" : "err");
    }
    prevState = state;

    // cadencia adaptativa
    schedulePoll(busy ? 1000 : 2000);
  }

  // ---- automatico por cortes ----
  function fmtSeg(s){
    if (s % 60 === 0) return (s / 60) + " min";
    return s > 60 ? Math.floor(s / 60) + " min " + (s % 60) + " s" : s + " s";
  }

  function renderAuto(a){
    autoApagar.checked = !!a.apagar;
    autoEncender.checked = !!a.encender;
    autoApagar.disabled = false;
    autoEncender.disabled = false;
    var corte = fmtSeg(a.corteApagarSeg), estable = fmtSeg(a.restablecerEncenderSeg);
    if (a.apagar && a.encender)
      autoTxt.textContent = "Urano se apagará automáticamente cuando falte el servicio eléctrico durante " +
        corte + " seguidos y, tras ese corte, se encenderá automáticamente cuando la luz regrese y se mantenga estable durante " +
        estable + ".";
    else if (a.apagar)
      autoTxt.textContent = "Urano se apagará automáticamente cuando falte el servicio eléctrico durante " +
        corte + " seguidos. El encendido es manual.";
    else if (a.encender)
      autoTxt.textContent = "Tras un corte de " + corte + " o más, Urano se encenderá automáticamente cuando la luz regrese y se mantenga estable durante " +
        estable + ". El apagado es manual.";
    else
      autoTxt.textContent = "El encendido y el apagado son manuales.";
  }

  function loadAuto(){
    if (autoBusy) return;
    fetch("/api/auto", {headers: headers(), cache:"no-store"})
      .then(function(r){ if (!r.ok) throw new Error("HTTP " + r.status); return r.json(); })
      .then(function(a){ if (!autoBusy) renderAuto(a); })
      .catch(function(){ /* se reintenta en el proximo ciclo */ });
  }

  function schedulePoll(ms){
    if (pollTimer) clearTimeout(pollTimer);
    pollTimer = setTimeout(poll, ms);
  }

  function poll(){
    if (autoTick++ % 5 === 0) loadAuto(); // modo automatico: ~cada 10 s (lo puede cambiar otro cliente)
    var st = fetch(API + "/status", {headers: headers(), cache:"no-store"})
      .then(function(r){ if (r.status===401){ throw new Error("Token invalido"); } return r.text(); });
    var el = fetch("/api/service-electric", {headers: headers(), cache:"no-store"})
      .then(function(r){ if (r.status===401){ throw new Error("Token invalido"); } return r.text(); })
      .then(function(t){ return t.trim() === "true"; })
      .catch(function(){ return null; }); // si falla el electrico, no romper el status
    Promise.all([st, el])
      .then(function(res){ render(res[0].trim(), res[1]); })
      .catch(function(e){
        stateLabel.textContent = "—";
        dot.className = "dot";
        stateHint.textContent = "sin conexion con el servicio";
        if (String(e.message).indexOf("Token") >= 0) flash(e.message, "err");
        schedulePoll(3000);
      });
  }

  function send(accion){
    flash("Enviando: " + accion + "…");
    btnOn.disabled = true; btnOff.disabled = true;
    fetch(API + "/energy/", {
      method:"POST",
      headers: headers({"Content-Type":"application/json"}),
      body: JSON.stringify({accion: accion})
    })
    .then(function(r){ return r.json().then(function(j){ return {code:r.status, body:j}; }); })
    .then(function(res){
      var r = res.body.resultado;
      if (r === "BLOQUEADO") flash("Hay otra operacion en curso", "err");
      else if (r === "SIN_CORRIENTE") flash("Sin servicio eléctrico: no se puede encender", "err");
      else if (r === "SIN_110V") flash("No se puede encender el servidor sin 110 V (el interruptor lateral no responde)", "err");
      else if (r === "NOOP") flash("Ya estaba en ese estado", "ok");
      else if (r === "OK")   { pending = {accion: accion, t0: Date.now()}; flash("Operacion iniciada…"); }
      else flash("Accion no valida", "err");
      poll(); // refrescar de inmediato; el polling confirma el resultado real
    })
    .catch(function(e){ flash("Error al enviar: " + e.message, "err"); poll(); });
  }

  btnOn.addEventListener("click", function(){ send("encender"); });
  btnOff.addEventListener("click", function(){ send("apagar"); });

  function bindAuto(chk, campo, nombre){
    chk.addEventListener("change", function(){
      var want = chk.checked;
      var body = {};
      body[campo] = want;
      autoBusy = true;
      autoApagar.disabled = true;
      autoEncender.disabled = true;
      fetch("/api/auto", {
        method:"POST",
        headers: headers({"Content-Type":"application/json"}),
        body: JSON.stringify(body)
      })
      .then(function(r){ if (!r.ok) throw new Error("HTTP " + r.status); return r.json(); })
      .then(function(a){
        autoBusy = false;
        renderAuto(a);
        flash(nombre + " automático " + (a[campo] ? "activado" : "desactivado"), "ok");
      })
      .catch(function(e){
        autoBusy = false;
        chk.checked = !want;
        autoApagar.disabled = false;
        autoEncender.disabled = false;
        flash("No se pudo cambiar el " + nombre.toLowerCase() + " automático (" + e.message + ")", "err");
      });
    });
  }
  bindAuto(autoApagar, "apagar", "Apagado");
  bindAuto(autoEncender, "encender", "Encendido");

  poll();
})();
</script>
</body>
</html>
